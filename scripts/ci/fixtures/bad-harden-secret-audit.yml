name: bad harden secret audit
on:
  pull_request:
permissions: {}
jobs:
  a:
    runs-on: ubuntu-24.04
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
          allowed-endpoints: >
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.eu-west-1.amazonaws.com:443

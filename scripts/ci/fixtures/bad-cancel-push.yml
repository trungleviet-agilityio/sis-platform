name: bad cancel push
on:
  push:
    branches: [main]
permissions: {}
concurrency:
  group: x
  cancel-in-progress: true
jobs:
  a:
    runs-on: ubuntu-24.04
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

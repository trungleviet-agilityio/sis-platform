# Reusable Terraform plan of one consumer env (ADR 0002 W2, W3, O11, O13, O14). Credit: ported from ship-it-safely and
# ship-it-serverless reusable-terraform-plan.yml (lab ADR 0004, 0007, 0008).
#
# Path frozen (W1): consumers pin `uses: trungleviet-agilityio/sis-platform/.github/workflows/reusable-terraform-plan.yml
# @<workflow_sha> # vX.Y.Z`. The plan role pins no workflow file (O14), so this file is not in any role trust.
# Jobs:
#   resolve      no credentials. Checks the job context and the caller's platform.lock (O11), runs the validator at
#                the same SHA (`lint`, M8) and outputs `family` and `region` for the gate and the egress list.
#                It fails when the family has no job here (SUPPORTED_FAMILIES, W2), so an unsupported runtime
#                never ends green with nothing planned.
#   plan-lambda  the lambda family (Phase 1 ships only this one, W2). Plan role, policy lint over
#                `terraform show -json` (T11), account-free summary, plan file deleted. No `environment:` (it would
#                change the OIDC subject the plan role trusts). Other families get their own job with their hosts.
#   comment      pull requests only: sticky comment with `pull-requests: write` and no AWS. Its script comes from
#                `.platform/` at `workflow_sha`, so the lab's base-SHA workaround is not needed (W3).
# Caller contract: `infra/envs/<env>/` holds the env root with an empty `backend "s3" {}` and a committed
# `.terraform.lock.hcl`; the caller passes `AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID_<ENV> }}` (a repo secret, O13).
# Every sis-platform script runs from `.platform/` (O11); the caller's files are checked out under `caller/` and read
# as data only. The sparse-checkout lists equal scripts/release/closure.txt (scripts/ci/check_sparse.py, AB8).
name: Terraform plan (reusable)

on:
  workflow_call:
    inputs:
      env:
        description: The env to plan (a key of platform.yaml envs; its root is infra/envs/<env>)
        type: string
        required: true
    secrets:
      AWS_ACCOUNT_ID:
        description: Account ID of the env (repo secret AWS_ACCOUNT_ID_<ENV>, O13)
        required: true

permissions: {}

# bash -eo pipefail for every run step: a failing command in a pipe fails the step.
defaults:
  run:
    shell: bash

env:
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"
  # No HashiCorp version check call: checkpoint-api.hashicorp.com is not on the egress list.
  CHECKPOINT_DISABLE: "1"

jobs:
  resolve:
    name: resolve
    # Fork and Dependabot pull requests get no OIDC token or secrets: skip them instead of failing.
    if: >-
      github.event_name != 'pull_request'
      || (github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.login != 'dependabot[bot]')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      family: ${{ steps.resolve.outputs.family }}
      region: ${{ steps.resolve.outputs.region }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
          allowed-endpoints: >
            github.com:443

      - name: Refuse any event but pull_request, push, workflow_dispatch and schedule
        env:
          EVENT: ${{ github.event_name }}
        run: |
          case "$EVENT" in
            pull_request | push | workflow_dispatch | schedule) ;;
            *) echo "::error::plan runs only on pull_request, push, workflow_dispatch or schedule, not on ${EVENT}"; exit 1 ;;
          esac

      - name: Assert the job runs a sis-platform reusable workflow (O11)
        env:
          JOB_REPOSITORY: ${{ job.workflow_repository }}
          JOB_FILE: ${{ job.workflow_file_path }}
        run: |
          if [ "$JOB_REPOSITORY" != "trungleviet-agilityio/sis-platform" ]; then
            echo "::error::job.workflow_repository is not trungleviet-agilityio/sis-platform"
            exit 1
          fi
          case "$JOB_FILE" in
            .github/workflows/reusable-*.yml) ;;
            *) echo "::error::job.workflow_file_path is not a reusable-*.yml workflow"; exit 1 ;;
          esac

      - name: Check out sis-platform at workflow_sha (closure only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: trungleviet-agilityio/sis-platform
          ref: ${{ job.workflow_sha }}
          path: .platform
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/release/closure.txt
            /.github/workflows/reusable-*.yml
            /scripts/platform/**
            /scripts/aws/**
            /scripts/lib.sh
            /scripts/tf/policy.py
            /scripts/tf/resolved-sources.sh
            /intake/sis_intake/**
            !/intake/sis_intake/__init__.py
            /intake/schema/**
            /intake/rules/compat.json
            /intake/rules/defaults.json
            /intake/rules/rules.json

      - name: Check out the caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: caller
          persist-credentials: false

      # Trust (job.workflow_sha in trusted_workflow_shas), validator (lint), project.env and the M6 values, before any
      # credential. --tfvars here is not used later (jobs share no disk): it fails a broken M7 emit before the
      # environment approval is requested.
      - name: Resolve the plan
        id: resolve
        env:
          JOB_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          JOB_WORKFLOW_FILE_PATH: ${{ job.workflow_file_path }}
          JOB_WORKFLOW_SHA: ${{ job.workflow_sha }}
          ENV_NAME: ${{ inputs.env }}
          # The families this workflow has a job for; keep equal to the `if:` gates of the family jobs (W2).
          SUPPORTED_FAMILIES: lambda
        run: |
          python3 -I "$GITHUB_WORKSPACE/.platform/scripts/platform/resolve.py" --caller caller --env "$ENV_NAME" \
            --tfvars "$RUNNER_TEMP/platform.tfvars.json" --families "$SUPPORTED_FAMILIES" >> "$GITHUB_OUTPUT"

  plan-lambda:
    name: plan (lambda)
    needs: resolve
    if: needs.resolve.outputs.family == 'lambda'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # OIDC token for the plan role (configure-aws-credentials)
    # A plan holds the state lock for a moment; never cancel it midway (H10). Plans and applies use separate groups,
    # so a queued plan never replaces a queued apply.
    concurrency:
      group: tf-plan-${{ inputs.env }}-${{ github.ref }}
      cancel-in-progress: false
    env:
      # Provider installation from the hashicorp namespace only; no implied local mirrors (closure file).
      TF_CLI_CONFIG_FILE: ${{ github.workspace }}/.platform/scripts/platform/terraformrc
    outputs:
      summary: ${{ steps.summary.outputs.summary }}
    steps:
      # Lambda family hosts, ported from ship-it-serverless (A9). The state bucket is reached path style through the
      # one regional S3 host (scripts/platform/tf-init.sh), so no host holds the project prefix.
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          disable-telemetry: true
          disable-sudo-and-containers: true
          allowed-endpoints: >
            github.com:443
            releases.hashicorp.com:443
            registry.terraform.io:443
            sts.${{ needs.resolve.outputs.region }}.amazonaws.com:443
            s3.${{ needs.resolve.outputs.region }}.amazonaws.com:443
            lambda.${{ needs.resolve.outputs.region }}.amazonaws.com:443
            apigateway.${{ needs.resolve.outputs.region }}.amazonaws.com:443
            monitoring.${{ needs.resolve.outputs.region }}.amazonaws.com:443
            sns.${{ needs.resolve.outputs.region }}.amazonaws.com:443
            api.ecr.${{ needs.resolve.outputs.region }}.amazonaws.com:443
            logs.${{ needs.resolve.outputs.region }}.amazonaws.com:443
            secretsmanager.${{ needs.resolve.outputs.region }}.amazonaws.com:443
            iam.amazonaws.com:443

      - name: Require the AWS_ACCOUNT_ID secret (O13)
        env:
          ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          if [ -z "$ACCOUNT" ]; then
            echo "::error::AWS_ACCOUNT_ID is empty: the caller must pass secrets.AWS_ACCOUNT_ID_<ENV> by name (O13)"
            exit 1
          fi
          if ! [[ "$ACCOUNT" =~ ^[0-9]{12}$ ]]; then
            echo "::error::AWS_ACCOUNT_ID is not a 12-digit account ID"
            exit 1
          fi

      - name: Check out sis-platform at workflow_sha (closure only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: trungleviet-agilityio/sis-platform
          ref: ${{ job.workflow_sha }}
          path: .platform
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/release/closure.txt
            /.github/workflows/reusable-*.yml
            /scripts/platform/**
            /scripts/aws/**
            /scripts/lib.sh
            /scripts/tf/policy.py
            /scripts/tf/resolved-sources.sh
            /intake/sis_intake/**
            !/intake/sis_intake/__init__.py
            /intake/schema/**
            /intake/rules/compat.json
            /intake/rules/defaults.json
            /intake/rules/rules.json

      - name: Check out the caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: caller
          persist-credentials: false

      # Jobs share no disk, so this job resolves again (same files, same SHA) for its own tfvars and role name.
      - name: Resolve the plan
        id: resolve
        env:
          JOB_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          JOB_WORKFLOW_FILE_PATH: ${{ job.workflow_file_path }}
          JOB_WORKFLOW_SHA: ${{ job.workflow_sha }}
          ENV_NAME: ${{ inputs.env }}
          GATE_REGION: ${{ needs.resolve.outputs.region }}
        run: |
          out="$(python3 -I "$GITHUB_WORKSPACE/.platform/scripts/platform/resolve.py" --caller caller \
            --env "$ENV_NAME" --tfvars "$RUNNER_TEMP/platform.tfvars.json")"
          if ! grep -qxF "region=${GATE_REGION}" <<<"$out"; then
            echo "::error::the region differs from the resolve job's region (egress list)"
            exit 1
          fi
          printf '%s\n' "$out" >> "$GITHUB_OUTPUT"

      - name: Install terraform (checksum verified)
        run: |
          "$GITHUB_WORKSPACE/.platform/scripts/platform/install-terraform.sh" "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # Before any credential: providers from the hashicorp namespace only (TF_CLI_CONFIG_FILE), init without the
      # backend, then what init really resolved (local or sis-platform at release_sha, AB4), then validate.
      - name: Terraform init without backend, resolved sources, validate (no credentials)
        working-directory: caller
        env:
          ENV_NAME: ${{ steps.resolve.outputs.env }}
          RELEASE_SHA: ${{ steps.resolve.outputs.release_sha }}
          TF_DATA_DIR: ${{ runner.temp }}/tf-data
        run: '"$GITHUB_WORKSPACE/.platform/scripts/platform/tf-init.sh" sources'

      - name: Assume the plan role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ steps.resolve.outputs.plan_role }}
          aws-region: ${{ needs.resolve.outputs.region }}
          role-session-name: gha-plan-${{ github.run_id }}-${{ github.run_attempt }}
          mask-aws-account-id: true
          retry-max-attempts: 3

      # The backend composed at run time (T3), then resolved-sources.sh again on what this init resolved.
      - name: Terraform init with the backend
        working-directory: caller
        env:
          ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID }}
          ENV_NAME: ${{ steps.resolve.outputs.env }}
          REGION: ${{ steps.resolve.outputs.region }}
          PREFIX: ${{ steps.resolve.outputs.prefix }}
          RELEASE_SHA: ${{ steps.resolve.outputs.release_sha }}
          TF_DATA_DIR: ${{ runner.temp }}/tf-data
        run: '"$GITHUB_WORKSPACE/.platform/scripts/platform/tf-init.sh" backend'

      - name: Terraform plan
        working-directory: caller
        env:
          ENV_NAME: ${{ steps.resolve.outputs.env }}
          TF_DATA_DIR: ${{ runner.temp }}/tf-data
        # Raw output stays in a file; a failure prints it with account-like runs redacted (tf-run.sh).
        run: |
          "$GITHUB_WORKSPACE/.platform/scripts/platform/tf-run.sh" plan -chdir="infra/envs/$ENV_NAME" plan \
            -input=false -no-color -lock-timeout=5m -var-file="$RUNNER_TEMP/platform.tfvars.json" \
            -out="$RUNNER_TEMP/tfplan"

      # T11 lint, then counts and one row per changed address; a 12-digit run fails it (consumer repos are public).
      - name: Policy lint and account-free summary
        id: summary
        working-directory: caller
        env:
          ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID }}
          ENV_NAME: ${{ steps.resolve.outputs.env }}
          PREFIX: ${{ steps.resolve.outputs.prefix }}
          TF_DATA_DIR: ${{ runner.temp }}/tf-data
        run: |
          "$GITHUB_WORKSPACE/.platform/scripts/platform/tf-run.sh" show --out "$RUNNER_TEMP/tfplan.json" \
            -chdir="infra/envs/$ENV_NAME" show -json "$RUNNER_TEMP/tfplan"
          python3 -I "$GITHUB_WORKSPACE/.platform/scripts/tf/policy.py" "$RUNNER_TEMP/tfplan.json" --allow-no-policy \
            --boundary-arn "arn:aws:iam::${ACCOUNT}:policy/${PREFIX}-${ENV_NAME}-workload-boundary"
          summary="$("$GITHUB_WORKSPACE/.platform/scripts/platform/plan-summary.sh" --title "Terraform plan (${ENV_NAME})" \
            < "$RUNNER_TEMP/tfplan.json" | "$GITHUB_WORKSPACE/.platform/scripts/aws/assert-no-account-id.sh")"
          printf '%s\n' "$summary" >> "$GITHUB_STEP_SUMMARY"
          delimiter="EOF_$(openssl rand -hex 8)"
          {
            echo "summary<<${delimiter}"
            printf '%s\n' "$summary"
            echo "${delimiter}"
          } >> "$GITHUB_OUTPUT"

      # Plan files hold every value: nothing is uploaded, and the files are removed even after a failure.
      - name: Remove the plan files
        if: always()
        run: rm -f "$RUNNER_TEMP/tfplan" "$RUNNER_TEMP/tfplan.json" "$RUNNER_TEMP/platform.tfvars.json"

  comment:
    name: plan comment
    needs: [resolve, plan-lambda]
    # After a failed plan too, so the pull request shows the failure. Never for a skipped resolve (fork, Dependabot).
    if: always() && github.event_name == 'pull_request' && needs.resolve.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # The only job with a write token: no AWS credentials; it runs one platform script from `.platform/`.
    permissions:
      contents: read
      pull-requests: write # create or update the sticky plan comment
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
          allowed-endpoints: >
            github.com:443
            api.github.com:443

      - name: Assert the job runs a sis-platform reusable workflow (O11)
        env:
          JOB_REPOSITORY: ${{ job.workflow_repository }}
          JOB_FILE: ${{ job.workflow_file_path }}
        run: |
          if [ "$JOB_REPOSITORY" != "trungleviet-agilityio/sis-platform" ]; then
            echo "::error::job.workflow_repository is not trungleviet-agilityio/sis-platform"
            exit 1
          fi
          case "$JOB_FILE" in
            .github/workflows/reusable-*.yml) ;;
            *) echo "::error::job.workflow_file_path is not a reusable-*.yml workflow"; exit 1 ;;
          esac

      - name: Check out sis-platform at workflow_sha (closure only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: trungleviet-agilityio/sis-platform
          ref: ${{ job.workflow_sha }}
          path: .platform
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/release/closure.txt
            /.github/workflows/reusable-*.yml
            /scripts/platform/**
            /scripts/aws/**
            /scripts/lib.sh
            /scripts/tf/policy.py
            /scripts/tf/resolved-sources.sh
            /intake/sis_intake/**
            !/intake/sis_intake/__init__.py
            /intake/schema/**
            /intake/rules/compat.json
            /intake/rules/defaults.json
            /intake/rules/rules.json

      - name: Post or update the plan comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ENV_NAME: ${{ inputs.env }}
          PLAN_RESULT: ${{ needs.plan-lambda.result }}
          SUMMARY: ${{ needs.plan-lambda.outputs.summary }}
        run: |
          if ! [[ "$ENV_NAME" =~ ^[a-z][a-z0-9]{1,7}$ ]]; then
            echo "::error::env is not a valid env name"
            exit 1
          fi
          marker="<!-- sis-platform:plan:${ENV_NAME} -->"
          # Checked in the plan job; checked again before it reaches a public comment.
          printf '%s\n' "$SUMMARY" | "$GITHUB_WORKSPACE/.platform/scripts/aws/assert-no-account-id.sh" >/dev/null
          if [ -z "$SUMMARY" ]; then
            SUMMARY="No plan summary was produced. Open the run log."
          fi
          body="$(printf '%s\n\n%s\n\nPlan job result: %s. Commit: %s. [Run log](%s)\n' \
            "$marker" "$SUMMARY" "$PLAN_RESULT" "$HEAD_SHA" "$RUN_URL")"
          # Only a comment written by the Actions bot is updated, never one that merely copies the marker.
          # All matching ids (one jq run per page); the first line is kept in bash, no `head` under pipefail.
          ids="$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"${marker}\"))) | .id")"
          existing="${ids%%$'\n'*}"
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/${REPO}/issues/comments/${existing}" -f body="$body" >/dev/null
            echo "Updated the plan comment"
          else
            gh api -X POST "repos/${REPO}/issues/${PR_NUMBER}/comments" -f body="$body" >/dev/null
            echo "Posted the plan comment"
          fi
